name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml reuses the Windows build, tests and installer

# Keyed by workflow too: a Release run calling this one must not cancel the push's CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build-mac -j "$(sysctl -n hw.ncpu)"
      - name: Engine tests (run_tests.sh)
        run: ./engine/run_tests.sh -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: ctest
        run: ctest --test-dir build-mac --output-on-failure
      - name: Watchdog tests
        run: bash helper/test_watchdog.sh build-mac/helper/OscillaWatchdog

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Newest Visual Studio on the runner (windows-latest no longer ships VS 2022); any VS 2022+ works.
      - name: Configure
        run: cmake -S . -B build-win -A x64
      - name: Build
        run: cmake --build build-win --config Release --parallel
      - name: ctest
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: Upload OscillaFX.exe
        uses: actions/upload-artifact@v4
        with:
          name: OscillaFX-windows-x64
          path: build-win/OscillaFX_artefacts/Release/
          if-no-files-found: error
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python -m pip install --quiet pillow
      - name: Installer
        run: packaging/windows/build_installer.ps1 -BuildDir build-win -OutDir dist
      # Needs the fxdevcon.exe the Installer step built; removes the driver again before the smoke test.
      - name: Live audio engine test (FxSound driver, endpoint routed onto itself)
        run: |
          foreach ($service in "AudioEndpointBuilder", "Audiosrv") {
              Set-Service $service -StartupType Manual
              Start-Service $service -ErrorAction Continue
          }
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table -AutoSize Name, Status
          $fxdevcon = "build-win\fxdevcon\Release\fxdevcon.exe"
          $install = Start-Process $fxdevcon -ArgumentList "install", "`"$PWD\driver\windows\x64\fxvad.inf`"" -PassThru -NoNewWindow
          if (-not $install.WaitForExit(180000)) {
              $install.Kill()
              Write-Warning "driver install did not finish: live audio test skipped"
              exit 0
          }
          Write-Host "fxdevcon install exit code $($install.ExitCode)"
          $selftest = (Get-ChildItem build-win -Recurse -Filter engine_selftest.exe | Where-Object FullName -like "*Release*" | Select-Object -First 1).FullName
          $env:OSCILLA_TEST_VIRTUAL_OUTPUT = "1"
          & $selftest --live-audio
          $code = $LASTEXITCODE
          & $fxdevcon remove
          exit $code
      - name: Installer smoke test (silent install, upgrade, uninstall)
        run: packaging/windows/test_installer.ps1 -Setup (Get-Item dist/OscillaFX-*-Setup-x64.exe).FullName -LogDir installer-logs
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OscillaFX-windows-installer-logs
          path: installer-logs/
          if-no-files-found: ignore
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OscillaFX-windows-x64-setup
          path: dist/OscillaFX-*-Setup-x64.exe
          if-no-files-found: error
