name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml reuses the Windows build, tests and installer

permissions:
  contents: read

# Keyed by workflow too: a Release run calling this one must not cancel the push's CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build-mac -j "$(sysctl -n hw.ncpu)"
      - name: Engine tests (run_tests.sh)
        run: ./engine/run_tests.sh -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: ctest
        run: ctest --test-dir build-mac --output-on-failure
      - name: Watchdog tests
        run: bash helper/test_watchdog.sh build-mac/helper/OscillaWatchdog

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Newest Visual Studio on the runner (windows-latest no longer ships VS 2022); any VS 2022+ works.
      - name: Configure
        run: cmake -S . -B build-win -A x64
      - name: Build
        run: cmake --build build-win --config Release --parallel
      - name: ctest
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: Upload OscillaFX.exe
        uses: actions/upload-artifact@v4
        with:
          name: OscillaFX-windows-x64
          path: build-win/OscillaFX_artefacts/Release/
          if-no-files-found: error
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python -m pip install --quiet pillow
      - name: Installer
        run: packaging/windows/build_installer.ps1 -BuildDir build-win -OutDir dist
      - name: Installer smoke test (silent install, upgrade, uninstall)
        run: packaging/windows/test_installer.ps1 -Setup (Get-Item dist/OscillaFX-*-Setup-x64.exe).FullName -LogDir installer-logs
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OscillaFX-windows-installer-logs
          path: installer-logs/
          if-no-files-found: ignore
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OscillaFX-windows-x64-setup
          path: dist/OscillaFX-*-Setup-x64.exe
          if-no-files-found: error
